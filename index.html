<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>迷境の旅人 - ローグライクRPG</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- タイトル画面 -->
  <div id="title-screen" style="display: none;">
    <div class="title-container">
      <h1 class="title-main">迷境の旅人</h1>
      <p class="title-sub">〜不思議のダンジョン〜</p>
      <div class="title-menu">
        <button id="new-game-btn" class="title-btn">はじめから</button>
        <button id="continue-btn" class="title-btn">つづきから</button>
      </div>
      <p class="title-hint">WASD/矢印キーで移動、Fで攻撃、Iで持ち物</p>
    </div>
  </div>

  <!-- 町画面 -->
  <div id="town-screen" style="display: none;"></div>

  <div id="game-wrapper">
    <div id="game-container">
      <!-- ステータスバー -->
      <div id="status-bar">
        <div class="status-row">
          <span id="floor-display">フロア: 1F</span>
          <span id="level-display">Lv: 1</span>
          <span id="hp-display">HP: 15/15</span>
          <span id="atk-display">攻: 0</span>
          <span id="def-display">防: 0</span>
        </div>
        <div class="status-row">
          <span id="strength-display">ちから: 8</span>
          <span id="fullness-display">満腹度: 100/100</span>
          <span id="gold-display">銭: 0</span>
        </div>
        <div class="status-row equip-row">
          <span id="equip-weapon-display">武器: なし</span>
          <span id="equip-shield-display">盾: なし</span>
          <span id="equip-ring-display">腕輪: なし</span>
        </div>
      </div>

      <!-- メインキャンバス -->
      <canvas id="game-canvas"></canvas>

      <!-- メッセージログ -->
      <div id="message-log">
        <div id="messages"></div>
      </div>
    </div>

    <!-- サイドパネル -->
    <div id="side-panel">
      <!-- ミニマップ -->
      <div id="minimap-panel">
        <div class="panel-title">マップ</div>
        <canvas id="minimap-canvas"></canvas>
      </div>

    <!-- 操作ガイド -->
    <div id="controls-panel">
      <div class="controls-title">操作方法</div>
      <div class="controls-section">
        <div class="controls-heading">移動</div>
        <div class="controls-grid">
          <span class="key">Q</span><span class="key">W</span><span class="key">E</span>
          <span class="key">A</span><span class="key-blank"></span><span class="key">D</span>
          <span class="key">Z</span><span class="key">S</span><span class="key">C</span>
        </div>
        <div class="controls-note">矢印キー / テンキーも可</div>
      </div>
      <div class="controls-section">
        <div class="controls-heading">行動</div>
        <div class="controls-list">
          <div><span class="key-inline">Space</span> 待機</div>
          <div><span class="key-inline">Enter</span> 拾う / 階段</div>
          <div><span class="key-inline">F</span> 攻撃</div>
          <div><span class="key-inline">I</span> インベントリ</div>
          <div><span class="key-inline">X</span> 足元を調べる</div>
          <div><span class="key-inline">M</span> ミュート切替</div>
        </div>
      </div>
      <div class="controls-section controls-link-section">
        <a href="guide.html" target="_blank" class="guide-link">遊び方ガイド</a>
      </div>
    </div>
    </div><!-- /side-panel -->
  </div>

  <!-- JavaScriptモジュール -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
